[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-disorder-predictor"
version = "0.1.0"
description = "A reproducible residue-level protein intrinsic-disorder prediction head"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["my_predictor*"]
